name: Refresh live facts
# Once a day: read the channel, the playlists and Medium, and commit data.json if anything changed.
on:
  schedule:
    - cron: '30 1 * * *'        # 07:00 India time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild data.json
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}     # optional; without it the channel page is read instead
        run: python3 tools/refresh.py
      - name: Commit if changed
        run: |
          git config user.name "hariprav.in bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Refresh live facts"
          git push
